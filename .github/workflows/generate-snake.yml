name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # run every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate Snake SVGs
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      - name: Remove bottom bar from SVGs
        run: |
          python3 -c "
          import re, glob
          for p in glob.glob('dist/*.svg'):
              with open(p, 'r', encoding='utf-8') as f:
                  s = f.read()
              s = re.sub(r'<rect class=\"u [^\"]*\"[^>]*/>', '', s)
              s = re.sub(r'viewBox=\"(-?\d+)\s+(-?\d+)\s+(\d+)\s+192\"', r'viewBox=\"\1 \2 \3 150\"', s)
              s = re.sub(r'height=\"192\"', r'height=\"150\"', s)
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(s)
          "

      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
